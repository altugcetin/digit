exec-once=digit

bind=SUPER,space,spawn,digitctl key notch
bind=ALT,space,spawn,digitctl key launcher
bind=SUPER,w,spawn,digitctl key wallpaper
bind=ALT,c,spawn,digitctl key control
bind=ALT,v,spawn,digitctl key clipboard
bind=ALT,Tab,spawn,digitctl key windows
bind=SUPER,Tab,spawn,digitctl key spaces
bind=ALT,d,spawn,digitctl key dock
bind=ALT,comma,spawn,digitctl key settings
bind=SUPER,l,spawn,digitctl key lock
bind=SUPER+SHIFT,e,spawn,digitctl key session
bind=NONE,Print,spawn,digit-snap
bind=CTRL,Print,spawn,digit-snap screen
bind=ALT,Print,spawn,digit-snap window
bind=SHIFT,Print,spawn,digit-snap --delay 3
bind=SUPER+SHIFT,s,spawn,digit-snap
bind=SUPER,e,spawn,digit-files
bind=SUPER+ALT,r,spawn,digit-rec toggle
bind=SUPER+ALT,s,spawn,digit-rec save-replay
bind=NONE,XF86AudioRaiseVolume,spawn,digitctl key volume-up
bind=NONE,XF86AudioLowerVolume,spawn,digitctl key volume-down
bind=NONE,XF86AudioMute,spawn,digitctl key mute
bind=NONE,XF86MonBrightnessUp,spawn,digitctl key brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,digitctl key brightness-down
bind=NONE,XF86KbdBrightnessUp,spawn,digitctl key kbd-up
bind=NONE,XF86KbdBrightnessDown,spawn,digitctl key kbd-down

windowrule=isfloating:1,appid:dev.digit.Snap,title:Screenshot
