exec-once = digit

bind = SUPER, SPACE, exec, digitctl key notch
bind = ALT, SPACE, exec, digitctl key launcher
bind = SUPER, W, exec, digitctl key wallpaper
bind = ALT, C, exec, digitctl key control
bind = ALT, V, exec, digitctl key clipboard
bind = ALT, TAB, exec, digitctl key windows
bind = ALT SHIFT, TAB, exec, digitctl key windows-back
bind = SUPER, TAB, exec, digitctl key spaces
bind = ALT, D, exec, digitctl key dock
bind = ALT, COMMA, exec, digitctl key settings
bind = SUPER, L, exec, digitctl key lock
bind = SUPER SHIFT, E, exec, digitctl key session
bind = , PRINT, exec, digit-snap
bind = CTRL, PRINT, exec, digit-snap screen
bind = ALT, PRINT, exec, digit-snap window
bind = SHIFT, PRINT, exec, digit-snap --delay 3
bind = SUPER SHIFT, S, exec, digit-snap
bind = SUPER, E, exec, digit-files
bind = SUPER ALT, R, exec, digit-rec toggle
bind = SUPER ALT, S, exec, digit-rec save-replay
bindel = , XF86AudioRaiseVolume, exec, digitctl key volume-up
bindel = , XF86AudioLowerVolume, exec, digitctl key volume-down
bindl = , XF86AudioMute, exec, digitctl key mute
bindel = , XF86MonBrightnessUp, exec, digitctl key brightness-up
bindel = , XF86MonBrightnessDown, exec, digitctl key brightness-down
bindel = , XF86KbdBrightnessUp, exec, digitctl key kbd-up
bindel = , XF86KbdBrightnessDown, exec, digitctl key kbd-down

windowrulev2 = float, class:^(dev\.digit\.Snap)$, title:^(Screenshot)$
layerrule = noanim, ^(digit-wallpapers)$
layerrule = noanim, ^(digit)$
