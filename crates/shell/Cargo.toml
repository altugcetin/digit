[package]
name = "digit-shell"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "digit"
path = "src/main.rs"

[dependencies]
kit = { path = "../kit" }
async-channel = "2.5.0"
futures-util = "0.3.34"
gdk4-wayland = { version = "0.11", features = ["wayland_crate", "v4_18"] }
glib-unix = "0.22"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
gtk4-layer-shell = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = "5.19"
libc = "0.2"
gio-unix = "0.22"
pulseaudio = "0.3"
imagesize = "0.13"
