[package]
name = "kit"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
material-colors = { version = "0.5", features = ["quantize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
gio-unix = "0.22"
libc = "0.2"
zbus = "5.19"
futures-util = "0.3.34"
async-channel = "2.5.0"
