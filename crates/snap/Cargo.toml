[package]
name = "digit-snap"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "digit-snap"
path = "src/main.rs"

[dependencies]
kit = { path = "../kit" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
gtk4-layer-shell = "0.8.1"
libc = "0.2"
serde_json = "1"
toml = "1.1.8"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
