[package]
name = "digit-store"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "digit-store"
path = "src/main.rs"

[dependencies]
kit = { path = "../kit" }
gio-unix = "0.22"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
